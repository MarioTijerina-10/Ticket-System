version: '3.8'

services:
  sqlserver_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - blazor-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  blazor-app:
    build:
      context: ./
      dockerfile: DockerFile
    container_name: blazor_app
    ports:
      - "8081:80"
    depends_on:
      sqlserver_db:
        condition: service_healthy
    networks:
      - blazor-net
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SERVER=${DB_SERVER}
      - DB_USER=${DB_USER}
    volumes:
      - ticketsapp-keys:/app/keys

volumes:
  sqlserver-data:
  ticketsapp-keys:

networks:
  blazor-net:
    driver: bridge
  dokploy-network:
    external: true
